# WiFi glossary terms. Rendered on /glossary/ with an anchor per term and DefinedTerm schema.
# `def` supports Markdown links.
- section: "Basics"
  terms:
    - term: "Router"
      def: "The box that creates your home network and shares one internet connection with all your devices. Most also broadcast WiFi."
    - term: "Modem"
      def: "The box that connects your home to your internet provider's line (cable, DSL, or fiber). A router plugs into it."
    - term: "Gateway"
      def: "A modem and router in one box, often rented from your internet provider."
    - term: "Access point"
      def: "A device that adds WiFi coverage to a wired network. Mesh nodes are a type of access point."
    - term: "SSID"
      def: "Your WiFi network's name."
    - term: "Ethernet"
      def: "A wired network connection. It is faster and more stable than WiFi for devices that stay put, like TVs, consoles, and desktops."
- section: "WiFi standards and bands"
  terms:
    - term: "WiFi 6 (802.11ax)"
      def: "The WiFi standard that improved performance on busy networks with many devices. Works on 2.4 GHz and 5 GHz."
    - term: "WiFi 6E"
      def: "WiFi 6 extended to the 6 GHz band, which has more room and less interference."
    - term: "WiFi 7 (802.11be)"
      def: "The newest standard. It adds wider 320 MHz channels on 6 GHz and Multi-Link Operation (MLO), which lets a device use more than one band at once. You need WiFi 7 devices to get the full benefit."
    - term: "2.4 GHz"
      def: "The band with the longest range but the lowest speeds and the most interference. Many smart-home devices only use 2.4 GHz."
    - term: "5 GHz"
      def: "Faster than 2.4 GHz with shorter range. The workhorse band for most phones and laptops."
    - term: "6 GHz"
      def: "The newest band, used by WiFi 6E and WiFi 7. It's fast and uncrowded, but it has the shortest range and struggles with walls."
    - term: "Channel width"
      def: "How much of a band a connection uses, measured in MHz. Wider channels are faster but more prone to interference."
    - term: "DFS channels"
      def: "Some 5 GHz channels are shared with weather and aircraft radar. Routers must move off them if radar is detected, which can cause brief drops."
    - term: "Band steering"
      def: "A router feature that moves devices to the best band automatically."
    - term: "MU-MIMO and OFDMA"
      def: "Features that let a router talk to several devices at the same time instead of taking turns. They help most in busy homes."
    - term: "Beamforming"
      def: "A technique that focuses the WiFi signal toward a device instead of spreading it evenly."
- section: "Speed and performance"
  terms:
    - term: "Mbps and Gbps"
      def: "Megabits and gigabits per second, the unit for internet and WiFi speed. 1 Gbps is 1,000 Mbps. Downloads in your browser often show MB/s (megabytes); divide Mbps by 8 to compare."
    - term: "Download and upload"
      def: "Download is data coming to you (streaming, browsing). Upload is data you send (video calls, cloud backups, posting videos)."
    - term: "Latency (ping)"
      def: "How long data takes to make a round trip, in milliseconds (ms). Lower is better, especially for gaming and calls."
    - term: "Jitter"
      def: "How much latency varies from moment to moment. High jitter makes calls choppy."
    - term: "Bufferbloat"
      def: "Lag caused when a busy connection makes data wait in a long queue. See our [bufferbloat guide](/guides/fix-bufferbloat-gaming-lag/)."
    - term: "QoS and SQM"
      def: "Quality of Service settings prioritize some traffic. Smart queue management (SQM) keeps latency low for everything when the connection is busy."
    - term: "Signal strength (dBm, RSSI)"
      def: "How strong the WiFi signal is at a device. Numbers closer to zero are stronger: -50 dBm is excellent, -80 dBm is weak."
    - term: "Dead zone"
      def: "A spot in your home where WiFi is too weak to use."
    - term: "Speed test"
      def: "A tool that measures your download, upload, and latency. Test with a wired laptop first to separate internet problems from WiFi problems."
- section: "Internet service"
  terms:
    - term: "ISP"
      def: "Internet service provider, such as Xfinity, Spectrum, AT&T, Verizon, T-Mobile, or Google Fiber."
    - term: "Fiber"
      def: "Internet delivered over fiber-optic lines. Usually the fastest and most consistent, with uploads as fast as downloads."
    - term: "Cable"
      def: "Internet delivered over the same coax lines as cable TV. Fast downloads, slower uploads, and shared with your neighborhood."
    - term: "5G home internet (fixed wireless)"
      def: "Internet delivered over a cellular network to a gateway in your home."
    - term: "ONT"
      def: "The optical network terminal: the small box that converts a fiber line into an Ethernet connection for your router."
    - term: "Data cap"
      def: "A monthly limit on how much data you can use before extra charges or slower speeds."
    - term: "Broadband label"
      def: "A standardized label, required by the FCC, that shows a plan's monthly price, fees, and typical speeds."
    - term: "CGNAT"
      def: "When your provider shares one public IP address among many customers. It can interfere with hosting game servers or remote access."
- section: "Mesh and wiring"
  terms:
    - term: "Mesh WiFi"
      def: "A system of two or more units (nodes) that work together to cover a whole home under one network name."
    - term: "Node or satellite"
      def: "A unit in a mesh system that isn't connected directly to the modem."
    - term: "Backhaul"
      def: "The connection between mesh nodes. It can be wireless or wired (Ethernet). Wired backhaul is faster and more reliable."
    - term: "Tri-band"
      def: "A router or mesh node with three radios, often used to give mesh backhaul its own band."
    - term: "Extender (repeater)"
      def: "A device that picks up your WiFi and rebroadcasts it. Simpler and cheaper than mesh, but usually slower."
    - term: "MoCA"
      def: "A way to run an Ethernet connection over the coax cable already in many US homes."
    - term: "Multi-gig (2.5GbE, 10GbE)"
      def: "Ethernet ports faster than 1 Gbps. Useful if your internet plan is faster than 1 Gbps or you use wired mesh backhaul."
    - term: "Cat5e, Cat6"
      def: "Ethernet cable types. Cat5e handles 1 Gbps and, at typical home lengths, 2.5 Gbps; Cat6 or better is a safer choice for 10 Gbps runs."
- section: "Security"
  terms:
    - term: "WPA3"
      def: "The newest WiFi security standard. Use it if all your devices support it, or WPA2/WPA3 mixed mode if some don't."
    - term: "WPA2-AES"
      def: "The older but still acceptable security setting. Avoid WEP, WPA, and TKIP."
    - term: "WPS"
      def: "A push-button or PIN setup feature. Convenient, but a known weak spot. Turn it off."
    - term: "Guest network"
      def: "A separate network for visitors and smart-home devices that keeps them away from your computers and phones."
    - term: "Firmware"
      def: "The software that runs your router. Keep it updated. See our [router hardening checklist](/guides/router-hardening-checklist/)."
    - term: "UPnP"
      def: "A feature that lets devices open ports on your router automatically. Handy for some games and risky if you don't need it."
    - term: "Port forwarding"
      def: "Manually letting outside traffic reach a device on your network, such as a game server or camera."
    - term: "DNS"
      def: "The internet's address book: it turns website names into addresses. Some DNS services can block malicious sites."
    - term: "VPN"
      def: "A service that encrypts traffic between your device and the VPN provider. Useful on public WiFi; it doesn't secure your router."
- section: "Smart home"
  terms:
    - term: "Matter"
      def: "A smart-home standard that lets devices work with Apple Home, Google Home, Amazon Alexa, and SmartThings. See our [Matter and Thread guide](/guides/matter-thread-smart-home-explained/)."
    - term: "Thread"
      def: "A low-power wireless network for smart-home devices like sensors and locks."
    - term: "Thread border router"
      def: "A device, often a smart speaker or streaming box, that connects a Thread network to your home network."
    - term: "IoT"
      def: "Internet of Things: smart plugs, cameras, thermostats, and other connected gadgets."
