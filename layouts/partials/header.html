<header class="site-header">
  <div class="wrap header-row">
    <a href="{{ site.Home.RelPermalink }}" class="brand" aria-label="{{ site.Title }} home">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--accent)"/>
        <path d="M6.5 13.2a13 13 0 0 1 19 0M10 17a8 8 0 0 1 12 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="16" cy="22" r="2.2" fill="var(--accent-2)"/>
      </svg>
      <span class="brand-text">WiFi Weekly</span>
    </a>
    <nav class="main-nav" aria-label="Primary">
      {{- range site.Menus.main }}
      {{- $active := or ($.IsMenuCurrent "main" .) (and $.Section (eq $.Section (lower .Name))) (and $.IsHome (eq .Name "Home")) }}
      <a href="{{ .URL }}"{{ if $active }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <a class="search-link" href="{{ "search/" | relURL }}">{{ partial "icon.html" "search" }}<span>Search</span></a>
  </div>
</header>
