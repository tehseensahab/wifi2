{{- $i := mod (.i | default 0) 4 -}}
{{- $class := .class | default "card-art" -}}
{{- if eq $i 0 -}}
<svg class="{{ $class }}" viewBox="0 0 300 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="180" fill="#EAF1F1"/>
  <path d="M40 140C90 80 210 80 260 140" stroke="#1F8A94" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M70 140C105 100 195 100 230 140" stroke="#146069" stroke-width="6" fill="none" stroke-linecap="round" opacity=".6"/>
  <circle cx="150" cy="150" r="7" fill="#E2A63B"/>
</svg>
{{- else if eq $i 1 -}}
<svg class="{{ $class }}" viewBox="0 0 300 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="180" fill="#EFEAE0"/>
  <rect x="120" y="60" width="60" height="34" rx="4" fill="#16233A"/>
  <path d="M110 60C110 30 190 30 190 60" stroke="#E2A63B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M100 60C100 15 200 15 200 60" stroke="#1F8A94" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/>
</svg>
{{- else if eq $i 2 -}}
<svg class="{{ $class }}" viewBox="0 0 300 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="180" fill="#E7EEF0"/>
  <g stroke="#146069" stroke-width="4" fill="none" opacity=".8">
    <path d="M30 40h60M30 60h100M30 80h40"/>
    <path d="M270 140h-60M270 120h-100M270 100h-40"/>
  </g>
  <circle cx="150" cy="90" r="18" fill="#1F8A94"/>
</svg>
{{- else -}}
<svg class="{{ $class }}" viewBox="0 0 300 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="180" fill="#F1E9D6"/>
  <path d="M20 150L100 60L160 110L280 20" stroke="#E2A63B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="280" cy="20" r="6" fill="#16233A"/>
</svg>
{{- end -}}
